[package]
name = "vector-gvector"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rayon = "1.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
memmap2 = "0.9"
bytemuck = "1.16"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "distance"
harness = false

[profile.release]
debug = true # profil alabilmek için sembolleri tut; performansı etkilemez
