[package]
name = "gvector"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A vector search engine written from scratch in Rust: HNSW, segment model, WAL, and a measurement-driven query planner."
repository = "https://github.com/guvenimat/gvector"
readme = "README.md"
keywords = ["vector-search", "hnsw", "ann", "embeddings"]
categories = ["database-implementations", "algorithms"]

[dependencies]
rand = "0.8"
rayon = "1.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
memmap2 = "0.9"
bytemuck = "1.16"
wide = "0.7"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "distance"
harness = false

[profile.release]
debug = true # keep symbols so profiling is possible; does not affect performance
